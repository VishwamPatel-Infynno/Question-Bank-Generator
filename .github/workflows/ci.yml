name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install "ruff==0.17.0"

      - name: Run Backend Linting (Ruff)
        run: ruff check backend/

      - name: Check Backend Formatting (Ruff)
        run: ruff format --check .

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcat_user
          POSTGRES_PASSWORD: mcat_password
          POSTGRES_DB: mcat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Pytest Test Suite
        env:
          DATABASE_URL: postgresql+asyncpg://mcat_user:mcat_password@localhost:5432/mcat_db
          PASSING_SCORE_THRESHOLD: 90
        run: |
          PYTHONPATH=backend pytest backend/tests -v -m "not live_e2e" --tb=short --durations=15 \
            --cov=app --cov-report=term --cov-report=xml

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Linting (Oxlint)
        run: pnpm lint

      - name: Run Frontend Unit Tests (Vitest)
        run: pnpm --dir frontend run test

      - name: Check For Unused CSS Classes
        run: pnpm --dir frontend run check:css

      - name: Verify Taxonomy Copies Are In Sync
        run: cmp backend/app/data/mcat_dependent_taxonomy.json frontend/src/constants/mcat_dependent_taxonomy.json

      - name: Verify Vite Production Build
        run: pnpm build

  dependency-audit:
    name: Dependency Audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports known vulnerabilities without blocking merges; review the log periodically
    continue-on-error: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Audit Backend Dependencies
        # Advisory: findings become a warning annotation instead of a red job. Some are in
        # transitive dependencies pinned by litellm (e.g. filelock<4) that cannot be upgraded here.
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || echo "::warning title=pip-audit::Known vulnerabilities found in backend dependencies; see the log above."

      - name: Install pnpm
        uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - name: Audit Frontend Dependencies
        run: pnpm audit --prod || echo "::warning title=pnpm audit::Known vulnerabilities found in frontend dependencies; see the log above."

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -f backend/Dockerfile -t mcat-backend .

      - name: Build Web Image
        run: docker build -f frontend/Dockerfile -t mcat-web .
