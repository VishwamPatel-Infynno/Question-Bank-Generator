name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The token only reads the repository; nothing here pushes or comments
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull-request runs are cancelled; every push to main runs to completion
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    name: Backend Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Ruff
        # One pin: the version comes from backend/requirements-dev.txt
        run: pip install "$(grep -o 'ruff==[0-9.]*' backend/requirements-dev.txt)"

      - name: Run Backend Linting (Ruff)
        run: ruff check .

      - name: Check Backend Formatting (Ruff)
        run: ruff format --check .

  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mcat_user
          POSTGRES_PASSWORD: mcat_password
          POSTGRES_DB: mcat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Run Pytest Test Suite
        # pyproject.toml sets the test path, PYTHONPATH and the "not live_e2e" marker
        env:
          DATABASE_URL: postgresql+asyncpg://mcat_user:mcat_password@localhost:5432/mcat_db
        run: |
          pytest -v --tb=short --durations=15 \
            --cov=app --cov-report=term --cov-report=xml --cov-fail-under=85

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Frontend Linting (Oxlint)
        run: pnpm --dir frontend run lint

      - name: Run Frontend Unit Tests (Vitest)
        run: pnpm --dir frontend run test

      - name: Check For Unused CSS Classes
        run: pnpm --dir frontend run check:css

      # The taxonomy copies are compared by backend/tests/test_taxonomy_sync.py

      - name: Verify Vite Production Build
        run: pnpm --dir frontend run build

  dependency-audit:
    name: Dependency Audit (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Advisory: findings become warning annotations (the `|| echo ::warning` below), never a red
    # job. Some are in transitive dependencies pinned by litellm that cannot be upgraded here.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Audit Backend Dependencies
        run: |
          pip install "pip-audit>=2.7,<3"
          pip-audit -r backend/requirements.txt || echo "::warning title=pip-audit::Known vulnerabilities found in backend dependencies; see the log above."

      - name: Install pnpm
        uses: pnpm/action-setup@v4  # version comes from package.json "packageManager"

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Audit Frontend Dependencies
        run: pnpm audit --prod || echo "::warning title=pnpm audit::Known vulnerabilities found in frontend dependencies; see the log above."

  docker-build:
    name: Docker Images Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build Web Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
