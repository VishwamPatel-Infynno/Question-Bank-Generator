services:
  postgres:
    image: postgres:16-alpine
    container_name: mcat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcat_db}
      POSTGRES_USER: ${POSTGRES_USER:-mcat_user}
      # Local-development default; set POSTGRES_PASSWORD (and DATABASE_URL) for anything shared
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcat_password}
    ports:
      # Loopback only: the database must not be reachable from other machines by default
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-mcat_user} -d $${POSTGRES_DB:-mcat_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional application stack: `docker compose --profile app up -d --build`
  # (the default `docker compose up -d` still starts only Postgres for local development)
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: mcat_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides any localhost DATABASE_URL from .env: inside compose the host is the service name
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mcat_user}:${POSTGRES_PASSWORD:-mcat_password}@postgres:5432/${POSTGRES_DB:-mcat_db}
    depends_on:
      postgres:
        condition: service_healthy
    # Single worker by design: batch tasks, in-flight drafts and semaphores live in process memory.
    stop_grace_period: 30s

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_ACCESS_KEY: ${VITE_API_ACCESS_KEY:-}
    container_name: mcat_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
