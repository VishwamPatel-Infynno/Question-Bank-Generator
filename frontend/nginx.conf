server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bulk question saves carry JSON with optional base64 images; keep in step with MAX_REQUEST_BODY_MB
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Security headers on every response (the backend adds its own on /api/*)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  # Scripts only from this origin (no inline); styles allow inline because React sets style
  # attributes; Google Fonts is the only third-party origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # Hashed build assets never change: cache them hard
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # add_header in a location drops the server-level ones, so repeat them
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # API and SSE streams go to the backend; buffering must be off or events arrive in bursts
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # SPA fallback; index.html itself must always be revalidated
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
