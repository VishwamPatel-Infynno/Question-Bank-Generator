server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Bulk question saves carry JSON with optional base64 images; keep in step with MAX_REQUEST_BODY_MB
  client_max_body_size 25m;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets never change: cache them hard.
  # (nginx drops server-level add_header lines in any location that sets its own, so each static
  # location includes the shared security headers explicitly.)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # API and SSE streams go to the backend; buffering must be off or events arrive in bursts
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (never append to) the client-supplied forwarding headers: this nginx is the
    # outermost hop, so a forged X-Forwarded-For would otherwise let a caller pick the IP the
    # backend rate limiter keys on. Behind another trusted proxy, set real_ip_* instead.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Shared secret injected server-side so it never ships in the public JS bundle. This file is
    # an envsubst template: ${API_ACCESS_KEY} comes from the container environment. An empty value
    # drops the header entirely (nginx does not forward empty headers), also discarding any
    # X-API-Key the browser sent. Use a key without quotes, backslashes or "$".
    proxy_set_header X-API-Key "${API_ACCESS_KEY}";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # SPA fallback; index.html itself must always be revalidated
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
